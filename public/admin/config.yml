backend:
  name: github
  repo: BrendonKing32/bentgrass-community-website
  branch: main
  # Must be the origin the site is actually served from, and match the OAuth
  # App's callback URL (see README). Switch to https://www.bentgrassneighborhood.org
  # once that domain is wired up.
  base_url: https://bentgrass.bkbuilds.dev
  auth_endpoint: api/auth

publish_mode: simple
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: news
    label: "News & Announcements"
    folder: "src/content/news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Summary", name: "summary", widget: "text", required: false, hint: "Shown in the homepage preview." }
      - label: "Cover Image"
        name: "coverImage"
        widget: "image"
        required: false
        hint: "Optional. Shown as a thumbnail on the news card."
        media_folder: "../../assets/news"
        public_folder: "../../assets/news"
      - { label: "Cover Image Alt Text", name: "coverImageAlt", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: events
    label: "Events & Calendar"
    folder: "src/content/events"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Start Date", name: "date", widget: "datetime" }
      - { label: "End Date (multi-day events)", name: "endDate", widget: "datetime", required: false }
      - { label: "Time", name: "time", widget: "string", required: false }
      - { label: "Location", name: "location", widget: "string", required: false }
      - { label: "Link URL", name: "link", widget: "string", required: false }
      - { label: "Link Label", name: "linkLabel", widget: "string", required: false }
      - label: "Cover Image"
        name: "coverImage"
        widget: "image"
        required: false
        hint: "Optional. Shown as a thumbnail on the event card."
        media_folder: "../../assets/events"
        public_folder: "../../assets/events"
      - { label: "Cover Image Alt Text", name: "coverImageAlt", widget: "string", required: false }
      - { label: "Details", name: "body", widget: "markdown" }

  - name: newsletters
    label: "Monthly Newsletters"
    folder: "src/content/newsletters"
    create: true
    slug: "{{year}}-{{month}}-newsletter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Newsletter URL", name: "url", widget: "string", required: false }

  - name: faq
    label: "FAQ"
    folder: "src/content/faq"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Question", name: "question", widget: "string" }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - "Getting Started"
          - "Districts & Governance"
          - "Covenants & Property Rules"
          - "Property Use"
          - "Property, Plots & Lot Info"
          - "Home Warranty & Builder Resources"
          - "Improvements"
          - "Safety & Emergencies"
          - "Community"
      - { label: "Order", name: "order", widget: "number", default: 0, hint: "Lower numbers show first within a category." }
      - { label: "Answer", name: "body", widget: "markdown" }

  - name: resources
    label: "General Resources"
    folder: "src/content/resources"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "URL", name: "url", widget: "string" }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Emergency & Weather", value: "emergency-weather" }
          - { label: "Safety", value: "safety" }
          - { label: "Local Government", value: "local-government" }
          - { label: "Community & Social", value: "community-social" }
      - { label: "Order", name: "order", widget: "number", default: 0 }
      - { label: "Description", name: "body", widget: "markdown", required: false }

  - name: gallery
    label: "Community Gallery"
    folder: "src/content/gallery"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title / Caption", name: "title", widget: "string" }
      - label: "Photo"
        name: "image"
        widget: "image"
        media_folder: "../../assets/gallery"
        public_folder: "../../assets/gallery"
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Local Events", value: "events" }
          - { label: "Local Critters", value: "critters" }
          - { label: "Local Weather", value: "weather" }
          - { label: "Neighborhood", value: "neighborhood" }
      - { label: "Date", name: "date", widget: "datetime", required: false }
      - { label: "Photo Credit", name: "credit", widget: "string", required: false }

  - name: businesses
    label: "Business Directory (pilot)"
    folder: "src/content/businesses"
    create: true
    slug: "{{slug}}"
    identifier_field: name
    summary: "{{name}}"
    fields:
      - { label: "Business Name", name: "name", widget: "string" }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Home Services", value: "home-services" }
          - { label: "Food & Drink", value: "food-drink" }
          - { label: "Health & Wellness", value: "health-wellness" }
          - { label: "Childcare & Education", value: "childcare-education" }
          - { label: "Pets", value: "pets" }
          - { label: "Professional Services", value: "professional-services" }
          - { label: "Retail & Crafts", value: "retail-crafts" }
          - { label: "Other", value: "other" }
      - { label: "Short Description", name: "summary", widget: "string", hint: "One sentence shown on the directory card." }
      - { label: "Website or Social Link", name: "url", widget: "string", required: false, hint: "Full URL including https://" }
      - { label: "Phone", name: "phone", widget: "string", required: false, hint: "e.g. (719) 555-0123" }
      - { label: "Email", name: "email", widget: "string", required: false }
      - { label: "Resident-Owned", name: "residentOwned", widget: "boolean", default: false, hint: "Turn on if the business is run by a Bent Grass neighbor." }
      - label: "Logo"
        name: "logo"
        widget: "image"
        required: false
        hint: "Optional. A small square logo works best."
        media_folder: "../../assets/businesses"
        public_folder: "../../assets/businesses"
      - { label: "Logo Alt Text", name: "logoAlt", widget: "string", required: false }
      - { label: "Show on Site", name: "listed", widget: "boolean", default: true, hint: "Turn off to hide this listing without deleting it." }
      - { label: "More Details", name: "body", widget: "markdown", required: false }

  - name: pages
    label: "District Info Pages"
    folder: "src/content/pages"
    create: false
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Body", name: "body", widget: "markdown" }
